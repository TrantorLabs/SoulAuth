name: SoulAuth isolated SurrealDB SDK 3.3 HTTP-only compatibility probe
on:
  push:
    branches: [security/surrealdb-http-sdk-probe-20261114]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Existing pinned Rust toolchain 1.95.0
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
          rustc --version
      - name: Resolve only HTTP SurrealDB SDK 3.3.5 without embedding DB core
        run: |
          set -euo pipefail
          cargo update -p surrealdb --precise 3.3.5
          cargo update -p surrealdb-types --precise 3.3.5
          cargo update -p openssl --precise 0.10.81
          cargo update -p ammonia --precise 4.1.9 || echo "NOTE: ammonia may no longer be linked in remote-only SDK"
          cargo update -p quinn-udp --precise 0.5.16 || echo "NOTE: quinn-udp may no longer be linked in remote-only SDK"
          python3 - <<'PY'
          import tomllib,json
          with open("Cargo.lock","rb") as f: ps=tomllib.load(f)["package"]
          names=["surrealdb","surrealdb-types","surrealdb-core","crypto-bigint","ammonia","openssl","quinn-udp"]
          report={n:[p["version"] for p in ps if p["name"]==n] for n in names}
          print(json.dumps(report,indent=2))
          open("sdk-compatibility-report.json","w").write(json.dumps(report,indent=2)+"\n")
          PY
      - name: Diagnose exact ownership of transitive vulnerabilities
        run: |
          cargo tree --locked --edges normal -i surrealdb-core > surrealdb-core-tree.txt 2>&1 || true
          cargo tree --locked --edges normal -i crypto-bigint > crypto-bigint-tree.txt 2>&1 || true
          head -n 65 surrealdb-core-tree.txt
          head -n 65 crypto-bigint-tree.txt
      - name: Check entire existing SoulAuth source against split HTTP/WS SDK
        run: |
          cargo check --locked
          cargo test --locked --test conformance -- --test-threads=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soulauth-surrealdb-sdk-compatibility
          path: |
            Cargo.toml
            Cargo.lock
            sdk-compatibility-report.json
            surrealdb-core-tree.txt
            crypto-bigint-tree.txt
          if-no-files-found: warn
