name: Bug report
description: Something behaves differently from what the documentation says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report a security vulnerability here.**
        See [SECURITY.md](https://github.com/TrantorLabs/SoulAuth/blob/main/SECURITY.md)
        for the private reporting path.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: >-
        What you did, what you expected, and what you got instead. If a page of the
        documentation says otherwise, link to it — a documentation/code mismatch is a
        bug in this project, not a misunderstanding on your side.
      placeholder: |
        Following the quickstart, step 5 returns 403 rather than 200.
        The response body is {"error":"forbidden","message":"…"}.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >-
        The shortest sequence that shows it. A `curl` command or a few lines of shell is
        ideal — a reproduction that runs is worth far more than a description.
      render: shell
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: Version and environment
      description: >-
        The commit or release you are on, how SoulAuth is running (binary, Docker
        Compose, something else), and the SurrealDB version. `surreal version` prints
        the last one.
      placeholder: |
        SoulAuth: v0.1.0 (or commit abc1234)
        Running:  docker compose
        SurrealDB: 3.2.4
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: >-
        Startup lines are usually the useful ones — the process reports the namespace and
        database it connected to, and refuses to start on several classes of
        misconfiguration. Redact secrets before pasting.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checked
    attributes:
      label: Before submitting
      options:
        - label: >-
            I re-imported `schema.sql` and `initial_data.sql` after upgrading (both are
            safe to re-run; skipping this is the most common cause of runtime errors
            after an upgrade)
          required: false
        - label: This is not a security vulnerability
          required: true
