# SoulAuth Published OpenAPI Contract
#
# 法位：Machine Contract Authority。
#
# GA-07 §17-19 与 §50：Human Reference 与 Guide 都不得自行创造 Endpoint、
# Field、Config Key、Permission、Wire Enum 或 Token Representation。
# 这里是它们的**唯一**来源。
#
# 生成依据：src/main.rs 的 axum 路由表 + src/routes/**。
# 由 tests/conformance.rs::j4 断言与 Runtime 一致 —— 手工增删端点会让它变红。
#
# 当前范围：路径、方法、认证要求、所需权限、**Error Envelope**。
#
# 成功响应的 schema 仍未冻结（23 §3-4：Serialization Contract 必须由工程侧
# 先冻结，不能由契约文件反向发明），因此这里不声明 requestBody 与 2xx schema。
#
# Error Envelope 现在可以声明了：全站错误已收口成同一形状，由
# tests/conformance.rs::g3（码是稳定字面量）与 ::j6（没有第二种形状）守住。
openapi: 3.1.0
info:
  title: SoulAuth
  version: "0.1.0"
  description: >-
    Actor-native identity and authentication infrastructure.
    Endpoint surface only; payload schemas are not yet frozen.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: "{APP_URL}"
    description: >-
      The public address, set by APP_URL. It is also the OIDC issuer — the two
      must match character for character.
    variables:
      APP_URL:
        default: http://localhost:8080

components:
  # `Error` 与 `OAuthError` 手写：它们带着「为什么是这个形状」的说明，
  # 而那不是能从类型推导出来的东西。
  #
  # 其余全部 schema 由 `contracts/generate-schemas.py` 从 Rust 结构体生成。
  # 手写它们必然漂移，而漂移的 schema 与准确的 schema 看起来一模一样 ——
  # 消费方按它构造请求，直到 422 才发现字段名不对。
  # 由 tests/conformance.rs::j11 断言与结构体一致。
  schemas:
    Error:
      type: object
      required:
      - error
      - message
      additionalProperties: true
      description: 'The single error envelope used across the whole API. `error` is a **stable machine-readable
        code** — branch on it. `message` is prose: its wording may improve at any time and must not be
        used for decisions. Individual errors carry documented additional fields.'
      properties:
        error:
          type: string
          description: Stable error code, snake_case.
          enum:
          - internal_error
          - invalid_credentials
          - email_not_verified
          - invalid_token
          - user_not_found
          - email_exists
          - username_exists
          - oauth_error
          - password_already_set
          - invalid_user_id
          - not_found
          - validation_error
          - permission_denied
          - insufficient_permissions
          - missing_permission
          - account_suspended
          - account_inactive
          - account_deleted
          - account_locked
          - rate_limit_exceeded
          - forbidden
          - bad_request
          - not_configured
          - unauthorized
          - service_unavailable
        message:
          type: string
          description: Human-readable explanation. Not part of the contract.
        required_permission:
          type: string
          description: Carried by `missing_permission` only — which permission is missing.
        locked_until_seconds:
          type: integer
          description: Carried by `account_locked` only — seconds until the lock clears.
    OAuthError:
      type: object
      required:
      - error
      description: Used by the OIDC protocol endpoints **only** (/api/oidc/token and friends). The shape
        is mandated by RFC 6749 §5.2 and cannot be unified with the Error envelope above.
      properties:
        error:
          type: string
        error_description:
          type: string
    AccountStatusResponse:
      properties:
        reason:
          type: string
        status:
          type: object
        updated_at:
          type: object
        updated_by:
          type: string
        user_id:
          type: string
      required:
      - user_id
      - status
      - updated_at
      - updated_by
      type: object
    ActivityLogRequest:
      properties:
        category:
          type: object
        end_date:
          type: object
        limit:
          type: integer
        page:
          type: integer
        start_date:
          type: object
        status:
          type: object
      type: object
    ActivityLogResponse:
      properties:
        activities:
          items:
            $ref: '#/components/schemas/UserActivityResponse'
          type: array
        limit:
          type: integer
        page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
      required:
      - activities
      - total
      - page
      - limit
      - total_pages
      type: object
    ActivityMetric:
      properties:
        action:
          type: string
        count:
          type: integer
        percentage:
          type: number
      required:
