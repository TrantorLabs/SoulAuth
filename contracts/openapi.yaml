      description: >-
        Liveness probe. Public, and registered after the rate-limiting layer so a prober never
        gets a 429.
      description_zh: >-
        存活探针。公开端点，且注册在限流层之后，探针不会被 429 打回。
      security: []
      responses:
        '200':
          description: OK
        default:
