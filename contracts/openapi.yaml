  /api/security/unlock:
    post:
      tags:
      - Security
      operationId: security_unlock
      description: >-
        Clear a lockout. Idempotent: unlocking something that is not locked returns `false`
        rather than erroring. Both lock and unlock are audited.
      description_zh: >-
        解除锁定。幂等：对未被锁定的对象解锁返回 `false` 而不是报错。上锁与解锁都会写审计。
      security:
      - bearerAuth: []
      x-required-permissions:
